<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title or 'Crypto Predictor' }}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        main {
            flex: 1;
        }
        .navbar-brand {
            font-weight: 600;
            font-size: 1.5rem;
        }
        footer {
            background-color: #212529;
            color: #adb5bd;
            text-align: center;
            font-size: 0.9rem;
            padding: 20px 0;
        }

        /* Add hover effect for the heart */
        footer .heart {
            font-size: 1.5rem;  /* Initial size of the heart */
            transition: transform 0.3s ease;  /* Smooth transition */
        }

        footer .heart:hover {
            transform: scale(1.5);  /* Grow the heart when hovered */
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Crypto Price Predictor</a>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="container my-5">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>Built with <span class="heart">❤️</span> using LSTM Deep Learning Models | © 2025 CopyRight reserved</p>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
